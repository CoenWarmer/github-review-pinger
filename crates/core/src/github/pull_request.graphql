fragment PullRequestFields on PullRequest {
  id
  number
  title
  url
  author {
    __typename
    login
  }
  isDraft
  closed
  createdAt
  reviewDecision
  mergeable
  autoMergeRequest {
    enabledAt
  }
  mergeQueueEntry {
    position
    estimatedTimeToMerge
    enqueuedAt
  }
  repository {
    nameWithOwner
  }
  commits(last: 1) {
    nodes {
      commit {
        oid
        committedDate
        statusCheckRollup {
          state
          # Timestamps only, to time how long checks take.
          contexts(first: 100) {
            totalCount
            nodes {
              __typename
              ... on CheckRun {
                status
                conclusion
                startedAt
                completedAt
              }
              ... on StatusContext {
                context
                state
                createdAt
              }
            }
          }
        }
      }
    }
  }
  # Who pushed lately, to tell whether a requested team has been active.
  recentCommits: commits(last: 20) {
    nodes {
      commit {
        committedDate
        author {
          user {
            login
          }
        }
      }
    }
  }
  reviewRequests(first: 25) {
    nodes {
      asCodeOwner
      requestedReviewer {
        __typename
        ... on User {
          login
        }
        ... on Bot {
          login
        }
        ... on Mannequin {
          login
        }
        ... on Team {
          slug
          combinedSlug
        }
      }
    }
  }
  latestReviews(first: 50) {
    nodes {
      state
      submittedAt
      author {
        __typename
        login
      }
    }
  }
  latestOpinionatedReviews(first: 50) {
    nodes {
      state
      submittedAt
      author {
        __typename
        login
      }
    }
  }
  # Every submitted review. Reviews that only reply in existing threads are
  # left out of timelineItems, so they have to come from here.
  reviews(last: 50) {
    nodes {
      state
      submittedAt
      url
      # Where the review's last comment lives, to link to it.
      comments(last: 1) {
        nodes {
          url
        }
      }
      author {
        __typename
        login
      }
    }
  }
  timelineItems(
    last: 50
    itemTypes: [
      READY_FOR_REVIEW_EVENT
      REVIEW_REQUESTED_EVENT
      ISSUE_COMMENT
    ]
  ) {
    nodes {
      __typename
      ... on ReadyForReviewEvent {
        createdAt
      }
      ... on ReviewRequestedEvent {
        createdAt
        requestedReviewer {
          __typename
          ... on User {
            login
          }
          ... on Bot {
            login
          }
          ... on Mannequin {
            login
          }
          ... on Team {
            slug
            combinedSlug
          combinedSlug
          }
        }
      }
      ... on IssueComment {
        createdAt
        url
        author {
          __typename
          login
        }
      }
    }
  }
}
