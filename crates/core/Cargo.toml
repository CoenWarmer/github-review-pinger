[package]
name = "review-pinger-core"
version.workspace = true
description = "Pull request logic shared by the desktop and web apps"
authors = ["Coen Warmer"]
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
log = "0.4.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
chrono-tz = "0.10.4"
