name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libasound2-dev

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile
      # Also produces dist/, which tauri::generate_context! needs at compile time.
      - run: pnpm build

      - name: Rust checks
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

  # The browser build: compile the core logic to WebAssembly and run it through
  # Node, which the Rust tests can't do, then test and build the web app on it.
  wasm:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: swatinem/rust-cache@v2
      # Must match the `wasm-bindgen` version pinned in crates/wasm/Cargo.toml.
      # rust-cache keeps the installed binary between runs.
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @review-pinger/wasm build:wasm
      - run: pnpm --filter @review-pinger/wasm typecheck
      - run: pnpm --filter @review-pinger/wasm smoke
      - run: pnpm --filter @review-pinger/web test
      - run: pnpm --filter @review-pinger/web build
