[workspace]
members = ["apps/desktop/src-tauri", "crates/core", "crates/wasm"]
resolver = "3"

[workspace.package]
version = "0.6.4"

# Profiles apply to the whole workspace, so the desktop app's release settings live here.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
